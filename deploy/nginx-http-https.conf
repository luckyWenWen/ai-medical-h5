server {
    listen 80;
    server_name your-domain.example.com;

    root /usr/share/nginx/html;
    index index.html;

    location = /yuwenzhen {
        return 301 /yuwenzhen/;
    }

    location /yuwenzhen/ {
        try_files $uri $uri/ /yuwenzhen/index.html;
    }

    location /api/ {
        proxy_pass http://192.168.1.88:9120/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://192.168.2.43:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate /etc/nginx/certs/your-domain.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/your-domain.key;

    root /usr/share/nginx/html;
    index index.html;

    location = /yuwenzhen {
        return 301 /yuwenzhen/;
    }

    location /yuwenzhen/ {
        try_files $uri $uri/ /yuwenzhen/index.html;
    }

    location /api/ {
        proxy_pass http://192.168.1.88:9120/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://192.168.2.43:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}